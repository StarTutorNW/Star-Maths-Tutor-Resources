<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Angles in Polygons | Star Maths Tutor</title>
<style>
:root{--navy:#101766;--pink:#eb088c;--line:#d8deea;--ink:#111827;--paper:#fff}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:linear-gradient(#fff,#f7f8fc);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.page{max-width:1020px;margin:auto;padding:16px 18px 24px}
header{display:flex;align-items:center;gap:14px;margin-bottom:14px}header img{width:96px;height:auto}h1{margin:0;color:var(--navy);font-size:clamp(26px,3vw,35px);letter-spacing:-.03em}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 5px 18px rgba(16,24,40,.05)}
.toolbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line)}
.toolbar label{font-weight:750;font-size:17px}.toolbar select{font:inherit;font-size:17px;min-width:255px;padding:9px 13px;border:1px solid #aebdd0;border-radius:9px;background:white;cursor:pointer}
.board{max-width:680px;margin:0 auto;padding:8px 14px 14px}svg{display:block;width:100%;height:auto;aspect-ratio:600/548;overflow:visible}
.bottom{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:64px;padding:0 6px 1px}
.switchwrap{display:flex;align-items:center;gap:12px}.toggle{display:flex;gap:11px;align-items:center;font-size:17px;font-weight:600;cursor:pointer;user-select:none}.toggle input{appearance:none;position:relative;width:51px;height:29px;border-radius:99px;background:#fb6068;border:2px solid #222;cursor:pointer;transition:background .15s}.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#171717;transition:transform .15s}.toggle input:checked{background:#55ef91}.toggle input:checked::after{transform:translateX(21px)}
.shapeName{font-size:14px;color:#667085}.nav{display:flex;gap:11px}button.arrow{width:57px;height:53px;border:2.5px solid #141414;border-radius:12px;background:#4ce9ed;cursor:pointer;display:grid;place-items:center;box-shadow:0 2px 0 #111}button.arrow svg{width:31px;height:31px}button.arrow:disabled{background:#d6dce2;opacity:.5;cursor:not-allowed}button.arrow:focus-visible,.toolbar select:focus-visible,.toggle input:focus-visible{outline:3px solid #eb088c;outline-offset:3px}
.placeholder{padding:65px 20px 95px;text-align:center;color:#667085;font-size:19px}.placeholder h2{color:var(--navy)}
.note{font-size:13px;color:#667085;text-align:center;padding:4px 10px 0}
@media(max-width:630px){.page{padding:11px}header img{width:70px}header{gap:10px}.toolbar{padding:11px;gap:7px}.toolbar select{width:100%;min-width:0}.board{padding:4px 8px 10px}.bottom{padding:0 2px}.arrow{width:50px!important;height:49px!important}.toggle{font-size:15px}.shapeName{display:none}}

/* Viewport-constrained teaching display */
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
.page{height:100dvh;max-width:1510px;padding:clamp(6px,1.1vh,14px) clamp(10px,1.2vw,20px);display:flex;flex-direction:column;min-height:0}
header{margin-bottom:clamp(4px,1vh,10px);flex:0 0 auto}
header img{width:clamp(55px,9vh,86px)}
h1{font-size:clamp(20px,3.3vh,34px)}
main.card{display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden}
.toolbar{padding:clamp(5px,.9vh,10px) 15px;flex:0 0 auto}
.toolbar label,.toolbar select{font-size:clamp(14px,1.8vh,17px)}
.toolbar select{padding:5px 10px}
.interiorLayout{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(335px,.9fr);gap:clamp(10px,1.5vw,20px);padding:clamp(8px,1vh,13px);align-items:stretch}
.board{min-height:0;min-width:0;display:flex;flex-direction:column;padding:0;max-width:none;width:100%;justify-content:center}
.board > svg{width:100%;height:calc(100% - clamp(46px,7vh,66px));min-height:0;aspect-ratio:auto;object-fit:contain;overflow:hidden}
.bottom{flex:0 0 clamp(46px,7vh,66px);min-height:0;padding:0 4px}
.tablePanel{display:flex;flex-direction:column;min-width:0;min-height:0;justify-content:center}
.angleTable{border-collapse:collapse;width:100%;table-layout:fixed;border:2px solid #212121;font-size:clamp(13px,2.3vh,23px);background:white}
.angleTable th,.angleTable td{border:1.5px solid #333;text-align:center;vertical-align:middle;padding:clamp(4px,1.15vh,11px) 3px;line-height:1.15}
.angleTable th{background:#d4d2fa;color:#111;font-weight:800;font-size:1.08em}
.angleTable th:first-child{width:36%}.angleTable th:nth-child(2){width:16%}.angleTable td:first-child{text-transform:lowercase}
.angleTable tr[hidden]{display:none}
.angleResult[hidden]{display:none}
.angleTable .mathCell{font-family:'Cambria Math',Cambria,'Times New Roman',serif}
.angleTable .generalCell{font-size:1.05em;font-weight:700}
.formulaButton{display:block;width:100%;font:600 clamp(11px,1.7vh,15px) Inter,Arial,sans-serif;background:#f1e7ff;border:1px solid #a993df;border-radius:7px;cursor:pointer;padding:clamp(3px,.6vh,7px) 2px;text-transform:none;line-height:1.2}
#generalPrompt{font:italic clamp(11px,1.6vh,15px) Inter,Arial,sans-serif;color:#71717a}
@media(max-width:780px){.interiorLayout{grid-template-columns:minmax(0,1fr) minmax(260px,.85fr);gap:7px}.angleTable{font-size:clamp(11px,2vh,17px)}}
@media(max-width:600px){html,body{overflow:auto}.page{height:auto;min-height:100dvh}.interiorLayout{display:flex;flex-direction:column;overflow:auto}.board{height:47dvh;flex:0 0 auto}.tablePanel{flex:0 0 auto}.angleTable{font-size:14px}.angleTable th,.angleTable td{padding:6px 2px}}

/* Exterior angle activity: same Star palette and single-screen workspace */
.exteriorLayout{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.17fr) minmax(310px,.83fr);gap:clamp(10px,1.5vw,22px);padding:clamp(8px,1.2vh,14px)}
.exteriorBoard{position:relative;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:12px;background:#fcfdff;overflow:hidden}
#exteriorSvg{width:100%;height:100%;aspect-ratio:auto;overflow:hidden}
.exteriorControls{min-height:0;display:flex;flex-direction:column;justify-content:center;gap:clamp(9px,1.8vh,18px)}
.exteriorControls h2{margin:0;color:var(--navy);font-size:clamp(20px,3vh,32px);line-height:1.12}
.controlCard{padding:clamp(10px,1.5vh,16px);border:1px solid var(--line);border-radius:12px;background:white;box-shadow:0 3px 10px #10182808}
.controlCard label{display:block;font-size:clamp(15px,2.05vh,20px);font-weight:700;margin-bottom:clamp(8px,1.3vh,15px)}
.controlCard strong{color:var(--pink)}
.exteriorControls input[type=range]{accent-color:var(--pink);display:block;width:100%;cursor:pointer;height:25px}
.sliderEnds{display:flex;justify-content:space-between;color:#667085;font-size:12px}
.sliderWithButton{display:flex;align-items:center;gap:12px}
.miniPlay{background:#e8e7ff;color:#101766;border:1px solid #a5a8de;border-radius:8px;font-size:17px;font-weight:bold;padding:7px 12px;cursor:pointer}
.extButtonRow{display:flex;gap:9px}
.walkButton,.stopButton,.reverseButton{border:1px solid #aab7cf;border-radius:10px;background:#effbf2;font:650 clamp(14px,1.95vh,19px) Inter,system-ui,sans-serif;padding:clamp(11px,1.6vh,16px) 12px;cursor:pointer;box-shadow:0 2px 6px #10182812}
.walkButton{flex:1;text-align:center;background:#defbea}
.stopButton{background:#fff0f0;color:#a12525}
.miniIcon{font-weight:900;margin-right:8px}
.reverseButton{background:#f4edff;text-align:center}
.labelAnglesButton{border:1px solid #b8a1d5;border-radius:10px;background:#f8edff;color:#59358c;font:700 clamp(14px,1.95vh,19px) Inter,system-ui,sans-serif;padding:clamp(10px,1.5vh,15px) 12px;cursor:pointer}.labelAnglesButton[aria-pressed="true"]{background:#e8d6ff;border-color:#8755c4}.extHint{font-size:clamp(12px,1.7vh,15px);text-align:center;color:#667085;margin:0;line-height:1.4}
.turnReadout{position:absolute;bottom:15px;left:15px;border:1px solid #8cc8a0;background:#e7ffed;color:#176839;border-radius:9px;font-size:clamp(15px,2.1vh,21px);padding:9px 13px;font-weight:650}
@media(max-width:800px){.exteriorLayout{grid-template-columns:minmax(0,1fr) minmax(260px,.8fr)}.exteriorControls{gap:8px}}
@media(max-width:600px){.exteriorLayout{display:flex;flex-direction:column;overflow:auto}.exteriorBoard{height:48dvh;flex:0 0 auto}.exteriorControls{flex:0 0 auto}}


/* Combined interior/exterior section */
.bothLayout{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.08fr) minmax(360px,.92fr);gap:clamp(10px,1.5vw,20px);padding:clamp(8px,1vh,13px);align-items:stretch}
.bothBoard > svg{width:100%;height:calc(100% - clamp(46px,7vh,66px));min-height:0;aspect-ratio:auto;object-fit:contain;overflow:hidden}
.bothTablePanel{justify-content:center}
.shapeModeButton{border:1px solid #96a4c5;border-radius:10px;background:#eef4ff;color:#18386a;font:700 clamp(13px,1.85vh,17px) Inter,system-ui,sans-serif;padding:8px 12px;cursor:pointer;box-shadow:0 2px 6px #10182812}
.shapeModeButton[aria-pressed="true"]{background:#e9fff1;border-color:#6eb888;color:#166534}
.bothTable{font-size:clamp(11.5px,1.95vh,18px)}
.bothTable th,.bothTable td{padding:clamp(4px,.95vh,9px) 4px}
.bothTable th{font-size:1em}
.bothTable .interiorHead{background:#d7ddff}
.bothTable .exteriorHead{background:#ffd8ea}
.bothTable .regularBand{background:#ece9ff;font-size:.92em;letter-spacing:.02em}
.bothTable .regularOnly{display:table-cell}.bothTable .regularOnlyRow{display:table-row}
.bothTable.hideRegular .regularOnly{display:none}
.bothTable.hideRegular .regularOnlyRow{display:none}
.bothTable.hideRegular th[rowspan="2"],.bothTable.hideRegular td{vertical-align:middle}
.bothTable .interiorVal{color:#273ebf;font-weight:700}
.bothTable .exteriorVal{color:#b4236c;font-weight:700}
.bothTable .regularVal{font-family:'Cambria Math',Cambria,'Times New Roman',serif;font-weight:700}
@media(max-width:860px){.bothLayout{grid-template-columns:minmax(0,1fr) minmax(300px,.88fr)}}
@media(max-width:600px){.bothLayout{display:flex;flex-direction:column;overflow:auto}.bothBoard{height:47dvh;flex:0 0 auto}.bothTablePanel{flex:0 0 auto}.bothTable{font-size:13px}}
.bothToggle{gap:9px;font-size:clamp(13px,1.85vh,17px);white-space:nowrap}
.bothToggle input{flex:0 0 auto}
.bothBoard svg{touch-action:none}
.bothBoard .vertexHandle:hover{fill:#c30070;stroke:#171717}
</style></head><body>

<script>
(()=>{
'use strict';
const NS='http://www.w3.org/2000/svg';
const svg=document.getElementById('diagram');
const select=document.getElementById('topic');

const rowNames={3:'triangle',4:'quadrilateral',5:'pentagon',6:'hexagon',7:'heptagon',8:'octagon',9:'nonagon',10:'decagon'};
for(let n=3;n<=10;n++){
 const tr=document.createElement('tr');tr.dataset.sides=n;
 tr.innerHTML=`<td>${rowNames[n]}</td><td>${n}</td><td class="mathCell"><span class="angleResult">${n-2} × 180°</span></td><td class="mathCell"><span class="angleResult">${(n-2)*180}°</span></td>`;
 angleRows.appendChild(tr);
}
const generalReveal=document.getElementById('generalReveal');
const generalFormula=document.getElementById('generalFormula');
const generalPrompt=document.getElementById('generalPrompt');
generalReveal.addEventListener('click',()=>{
 const reveal=generalFormula.hidden;
 generalFormula.hidden=!reveal;generalPrompt.hidden=reveal;
 generalReveal.setAttribute('aria-expanded',String(reveal));
 generalReveal.textContent=reveal?'Hide general rule':'Reveal general rule';
});

let sides=3;
const maxSides=10;
const colours=['#eb174e','#ffe32e','#4164d9','#21b88b','#ff9e39','#b35cdf','#e86db1','#37a4ba'];
const names={3:'Equilateral triangle',4:'Square',5:'Regular pentagon',6:'Regular hexagon',7:'Regular heptagon',8:'Regular octagon',9:'Regular nonagon',10:'Regular decagon'};
function add(tag,attrs,parent=svg){const e=document.createElementNS(NS,tag);for(const [key,val] of Object.entries(attrs))e.setAttribute(key,String(val));parent.appendChild(e);return e;}
function points(n){const cx=300,cy=269,R=n===3?230:n===4?223:228;const start=n===4?-3*Math.PI/4:-Math.PI/2;
return Array.from({length:n},(_,i)=>({x:cx+R*Math.cos(start+2*Math.PI*i/n),y:cy+R*Math.sin(start+2*Math.PI*i/n)}));}
function polygonPath(p){return p.map((v,i)=>(i?'L':'M')+v.x.toFixed(3)+' '+v.y.toFixed(3)).join(' ')+' Z';}
function wedge(v,a,b,r,colour){
 let a1=Math.atan2(a.y-v.y,a.x-v.x),a2=Math.atan2(b.y-v.y,b.x-v.x);
 let d=(a2-a1+Math.PI*3)%(2*Math.PI)-Math.PI;

<script>
(()=>{

 if(!collapsed){
  el('path',{d:p.map((v,i)=>`${i?'L':'M'}${v.x.toFixed(3)} ${v.y.toFixed(3)}`).join(' ')+' Z',fill:'none',stroke:'#111827','stroke-width':3.1,'stroke-linejoin':'round'});

 // Draw all exterior wedges at a constant size, even when vertices collapse.
 for(let i=0;i<n;i++){
  const v=p[i],before=reference[(i-1+n)%n],orig=reference[i],after=reference[(i+1)%n];

   el('path',{d:`M ${v.x} ${v.y} L ${sx} ${sy} A ${ANGLE_R} ${ANGLE_R} 0 0 ${clockwise?1:0} ${v.x+ANGLE_R*Math.cos(mid)} ${v.y+ANGLE_R*Math.sin(mid)} Z`,fill:'#8deaab',stroke:GREEN,'stroke-width':2.2});

 }
 // The green trail is permanently painted on completed sides and partially on the current side.
 if(active&&radius>0){
  for(let i=0;i<n;i++){
   let fraction=at>=n||i<current?1:i===current?sideFraction:0;
   if(fraction<=0)continue;

   const text=el('text',{x,y,'text-anchor':'middle','dominant-baseline':'middle',fill:'#45205e','font-size':n>=9?16:19,'font-weight':750,'font-family':'Cambria Math, Georgia, serif',stroke:'#fff','stroke-width':4,'paint-order':'stroke','stroke-linejoin':'round'});

 }
 if(active){

  const idx=current,base=p[idx],following=p[(idx+1)%n];

function cancelWalk(){walking=false;walkCompleted=false;elapsed=0;lastTime=null;cancelAnimationFrame(walkRaf);readout.hidden=true;stop.hidden=true;play.disabled=false;draw();}

play.addEventListener('click',()=>{if(walking)return;walkCompleted=false;elapsed=0;lastTime=null;walking=true;readout.hidden=false;stop.hidden=false;play.disabled=true;draw();walkRaf=requestAnimationFrame(frame);});
stop.addEventListener('click',cancelWalk);
side.addEventListener('input',()=>{cancelWalk();});
size.addEventListener('input',()=>{cancelWalk();});
rev.addEventListener('click',()=>{cancelWalk();clockwise=!clockwise;draw();});
labelsBtn.addEventListener('click',()=>{showLabels=!showLabels;labelsBtn.setAttribute('aria-pressed',String(showLabels));labelsBtn.textContent=showLabels?'Hide exterior angle sizes':'Show exterior angle sizes';draw();});
function shrinkFrame(){if(!shrinkAnimating)return;let v=Number(size.value)+shrinkDirection*1.2;if(v<=0){v=0;shrinkDirection=1;}else if(v>=100){v=100;shrinkAnimating=false;shrinkPlay.textContent='▶';}size.value=v;draw();if(shrinkAnimating)shrinkRaf=requestAnimationFrame(shrinkFrame);}
shrinkPlay.addEventListener('click',()=>{if(shrinkAnimating){shrinkAnimating=false;cancelAnimationFrame(shrinkRaf);shrinkPlay.textContent='▶';return;}cancelWalk();shrinkAnimating=true;shrinkDirection=Number(size.value)>0?-1:1;shrinkPlay.textContent='Ⅱ';shrinkRaf=requestAnimationFrame(shrinkFrame);});
side.addEventListener('change',()=>{shrinkAnimating=false;cancelAnimationFrame(shrinkRaf);shrinkPlay.textContent='▶';});
draw();
})();
</script>

<script>
(()=>{
'use strict';
const NS='http://www.w3.org/2000/svg';

const bothRows=document.getElementById('bothRows');
const bothBack=document.getElementById('bothBack');
const bothForward=document.getElementById('bothForward');
const bothMode=document.getElementById('bothModeToggle');
const bothShapeName=document.getElementById('bothShapeName');
const bothTable=document.getElementById('bothTable');
const bothNames={3:'triangle',4:'quadrilateral',5:'pentagon',6:'hexagon',7:'heptagon',8:'octagon',9:'nonagon',10:'decagon'};
let bothSides=3, irregular=false;

 const tr=document.createElement('tr');tr.dataset.sides=n;
 tr.innerHTML=`<td>${bothNames[n]}</td><td class="interiorVal">${(n-2)*180}°</td><td class="exteriorVal">360°</td><td class="regularVal regularOnly">${formatAngle(((n-2)*180)/n)}</td><td class="regularVal regularOnly">${formatAngle(360/n)}</td>`;

  irregularCache[n]=Array.from({length:n},(_,i)=>{

 add('path',{d:`M ${v.x} ${v.y} L ${x1} ${y1} A ${r} ${r} 0 0 ${d>=0?1:0} ${x2} ${y2} Z`,fill,stroke,'stroke-width':1.4,'stroke-linejoin':'round'});

 bothSvg.replaceChildren();

   const prev=pts[(i-1+bothSides)%bothSides], v=pts[i], next=pts[(i+1)%bothSides];

   const interiorLabelR=Math.max(38,Math.min(66,Math.hypot(v.x-cx,v.y-cy)*0.34));

   const interiorShown=Math.round(angs.interior*180/Math.PI);
   t1.textContent=irregular?`${interiorShown}°`:formatAngle(angs.interior*180/Math.PI);
   const t2=add('text',{x:exteriorX,y:exteriorY,'text-anchor':'middle','dominant-baseline':'middle',fill:'#b4236c','font-size':bothSides>=8?14:17,'font-weight':760,'font-family':'Cambria Math, Cambria, Times New Roman, serif',stroke:'#fff','stroke-width':4,'paint-order':'stroke'});

  pts.forEach((v,i)=>{

// Drag only in irregular mode, preserving a simple convex polygon so that

function validPolygon(p){
 if(p.some(v=>v.x<100||v.x>500||v.y<78||v.y>455))return false;

  const a=p[i],b=p[(i+1)%p.length],c=p[(i+2)%p.length];

</script>
