<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Product Rule for Counting | Star Maths Tutor</title>
<style>
:root{--navy:#101766;--pink:#eb088c;--ink:#111827;--muted:#667085;--border:#d8deea;--blue:#2563eb;--green:#0f8c62;--purple:#6d44c2;--pale:#f7f8fc}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(180deg,#fff,#f7f8fc)}
.page{max-width:1460px;margin:auto;padding:clamp(10px,1.7vh,18px)}header{display:flex;align-items:center;gap:12px;margin:0 0 12px}header img{height:clamp(55px,8vh,84px);width:auto}h1{font-size:clamp(25px,3.5vh,38px);letter-spacing:-.03em;color:var(--navy);margin:0}h2,h3,p{margin-top:0}
.card{background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:0 5px 18px rgba(16,24,40,.05)}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 18px;border-bottom:1px solid var(--border)}.chooser{display:flex;align-items:center;gap:11px}.chooser label{font-weight:750;font-size:17px}.chooser select{font:inherit;font-weight:650;font-size:16px;border:1px solid #aebdd0;border-radius:9px;background:white;padding:9px 12px;min-width:340px;color:var(--navy)}.toolbar-note{color:var(--muted);font-size:13px;max-width:440px;text-align:right}
.question{display:flex;align-items:center;gap:14px;margin:12px 14px 0;padding:13px 16px;background:#fbfcff;border:1px solid #e5eaf3;border-radius:11px}.qtag{font-size:11px;font-weight:850;color:var(--purple);background:#ede9fe;padding:7px 9px;border-radius:8px;white-space:nowrap;letter-spacing:.04em}.question p{font-size:clamp(17px,2.1vh,21px);font-weight:620;line-height:1.4;margin:0}.layout{display:grid;grid-template-columns:minmax(330px,.9fr) minmax(450px,1.1fr);gap:14px;padding:14px}.panel{border:1px solid var(--border);border-radius:12px;padding:16px;background:#fff;min-width:0;display:flex;flex-direction:column;gap:13px}.panel-title{font-weight:800;font-size:19px;color:var(--navy);line-height:1.1}.hint{font-size:14px;color:#475467;line-height:1.35;min-height:38px}.groups{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}.group{border:1px solid #e0e7f0;background:#fbfcff;border-radius:12px;padding:11px;min-height:120px}.group h3{font-size:14px;color:#475467;font-weight:750;margin:0 0 11px}.tokens{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}.token{width:44px;height:44px;border:2px solid #c7d3e7;border-radius:12px;background:white;display:grid;place-items:center;font-weight:800;font-size:20px;transition:transform .3s,background .3s,box-shadow .3s,opacity .3s}.token.active{transform:translateY(-6px) scale(1.10);background:#e4eeff;border-color:#2563eb;box-shadow:0 5px 14px #2563eb2a}.token.taken{background:#f2f4f7;color:#98a2b3;opacity:.45}.token.pink{border-color:#f7b9df;color:#b4236c}.token.pink.active{background:#ffe5f3;border-color:var(--pink);color:#9f1261}.choice-strip{min-height:78px;background:#fbfcff;border:1px dashed #c8d3e5;border-radius:11px;display:flex;align-items:center;justify-content:center;gap:15px;padding:9px}.slot{text-align:center;min-width:90px}.slot small{display:block;color:#667085;font-weight:700;font-size:12px;margin-bottom:5px}.slot .slot-value{font-family:'Cambria Math',Cambria,'Times New Roman',serif;font-weight:700;font-size:26px;color:var(--navy)}.slot .slot-value.blank{color:#bac5d5}.multiply{font:700 25px 'Cambria Math',Cambria,serif;color:#667085}.explanation{min-height:93px;border-left:4px solid #8075d8;border-radius:8px;background:#f7f5ff;padding:13px 16px;font-size:15px;line-height:1.45;color:#344054}.explanation strong{color:#101766}
.grid-heading{display:flex;justify-content:space-between;align-items:center;gap:10px}.axis-note{color:#667085;font-size:12px}.outcomes{display:grid;grid-template-columns:52px repeat(4,minmax(0,1fr));gap:6px;width:100%;max-width:610px;margin:auto;align-content:center}.cell,.axis{min-height:58px;display:flex;justify-content:center;align-items:center;text-align:center;border-radius:9px}.axis{font-size:16px;font-weight:800;color:#344054;background:#eef2f9;border:1px solid #e0e6ef}.corner{background:transparent;border:none;font-size:11px;font-weight:700;color:#667085}.cell{font:700 clamp(15px,1.7vw,19px) 'Cambria Math',Cambria,'Times New Roman',serif;border:1.5px solid #d6e1ef;background:#fff;position:relative;transition:background .28s,opacity .28s,transform .28s;color:var(--navy)}.cell.hidden-cell{opacity:.23;color:transparent;background:#fff}.cell.invalid{background:#f1f2f4;color:#9ca3af}.cell.invalid:after{content:'×';position:absolute;font:800 30px Inter,Arial,sans-serif;color:#abb2bd}.cell.duplicate{background:#fff0f2;color:#b26474;text-decoration:line-through;text-decoration-thickness:2px;opacity:.76}.cell.valid{background:#dceafe;border-color:#8fb5f5}.cell.first-choice{background:#fce1f0;border-color:#ed9dc6}.cell.keep{background:#e3f7ed;border-color:#92d8b6}.cell.reveal{animation:pop-in .4s both;animation-delay:calc(var(--i)*45ms)}@keyframes pop-in{from{opacity:0;transform:scale(.75)}to{opacity:1;transform:scale(1)}}.legend{display:flex;justify-content:center;gap:13px;flex-wrap:wrap;font-size:12px;color:#475467;min-height:20px}.legend span{display:flex;align-items:center;gap:5px}.swatch{width:12px;height:12px;border:1px solid #bbb;border-radius:3px;background:#dceafe}.swatch.invalid{background:#f1f2f4}.swatch.duplicate{background:#fff0f2}.swatch.keep{background:#e3f7ed}
.result{border:1px solid #dce3f1;border-radius:12px;background:#fbfcff;min-height:104px;padding:12px 15px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px}.result-label{font-size:12px;font-weight:800;letter-spacing:.035em;color:#667085;text-transform:uppercase}.equation{font-family:'Cambria Math',Cambria,'Times New Roman',serif;font-size:clamp(23px,3.3vh,34px);font-weight:700;line-height:1.2;text-align:center;color:var(--navy);white-space:nowrap}.result .why{font-size:13px;color:#475467;text-align:center;min-height:16px}
footer{padding:0 14px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px}.controls{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid #9baecb;border-radius:9px;background:#f5f7fb;font:700 15px Inter,system-ui,sans-serif;padding:10px 16px;cursor:pointer;color:#1a325a}.btn.primary{background:#dbf7fb;border:2px solid #15233b;color:#0d2444}.btn.pink{background:#fce9f4;border-color:#edabce;color:#9f1261}.btn:disabled{cursor:default;opacity:.42}.progress{font-size:14px;color:#667085;font-weight:650;white-space:nowrap}
@media(min-width:1050px) and (min-height:700px){.page{height:100dvh;display:flex;flex-direction:column;overflow:hidden}main{display:flex;flex-direction:column;min-height:0;flex:1}.layout{flex:1;min-height:0}.panel{min-height:0;justify-content:space-around}.outcomes{max-width:570px}.cell,.axis{min-height:clamp(39px,6.6vh,72px)}}
@media(max-width:900px){.layout{grid-template-columns:1fr}.toolbar{flex-wrap:wrap}.toolbar-note{text-align:left}.outcomes{max-width:600px}.panel{padding:14px}}@media(max-width:520px){.page{padding:8px}.toolbar{padding:11px}.chooser{flex-wrap:wrap}.chooser select{min-width:0;width:100%}.question{margin:8px 8px 0}.layout{padding:8px;gap:8px}.panel{padding:11px}.token{width:37px;height:40px}.outcomes{grid-template-columns:38px repeat(4,minmax(0,1fr));gap:4px}.cell,.axis{min-height:48px;font-size:14px}.slot{min-width:75px}.question p{font-size:16px}footer{padding:5px 8px 12px}.btn{padding:9px 11px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* Version 2: compact single-screen presentation and independent calculation reveal. */
.choice-strip{min-height:64px;padding:6px;gap:25px}.slot{min-width:110px}
.calcReveal{background:#fce9f4;border-color:#edabce;color:#9f1261;padding:8px 14px}
.result{min-height:87px;gap:4px;padding:8px 12px}.equation[hidden],.why[hidden]{display:none}
@media(min-width:1050px){
 .page{height:100dvh;display:flex;flex-direction:column;overflow:hidden;padding:clamp(6px,1vh,12px)}
 header{margin-bottom:clamp(4px,.8vh,8px)}header img{height:clamp(44px,6.3vh,65px)}h1{font-size:clamp(22px,3.2vh,34px)}
 main{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
 .toolbar{padding:clamp(5px,.75vh,9px) 13px}.chooser select{padding:6px 10px}

 .layout{flex:1;min-height:0;gap:10px;padding:9px 11px}
 .panel{min-height:0;gap:clamp(5px,.8vh,10px);padding:clamp(8px,1.2vh,13px);justify-content:space-around}
 .panel-title{font-size:clamp(16px,2.2vh,19px)}.hint{min-height:0;font-size:clamp(12px,1.8vh,14px)}
 .group{min-height:0;padding:clamp(6px,.9vh,10px)}.group h3{margin-bottom:7px}
 .token{width:clamp(34px,5.1vh,44px);height:clamp(34px,5.1vh,44px);font-size:17px}
 .choice-strip{min-height:0;padding:5px}.slot .slot-value{font-size:clamp(19px,3vh,25px)}
 .explanation{min-height:0;padding:clamp(7px,1.1vh,12px);font-size:clamp(12px,1.8vh,15px)}
 .outcomes{max-width:570px;gap:clamp(3px,.6vh,6px)}.cell,.axis{min-height:clamp(31px,5.8vh,56px)}
 .result{min-height:clamp(65px,10vh,92px)}.equation{font-size:clamp(20px,3.4vh,30px)}
 footer{padding:0 11px 9px}.btn{padding:clamp(6px,.9vh,10px) 11px;font-size:13px}
}

/* V3: keep choices and outcomes aligned; no redundant selected-pair box. */
.token.visited{background:#ffe8f4;border-color:#ed9dc6;color:#9f1261}
.token.active{transform:translateY(-4px) scale(1.07)}
.cell.current-pair{outline:3px solid #e10084;outline-offset:-3px;box-shadow:0 0 0 2px #fce7f3;transform:scale(1.02);z-index:1}
.cell.hidden-cell{color:transparent}
.group{min-height:95px}
.panel{justify-content:space-around}
@media(min-width:1050px){.panel{gap:clamp(6px,1vh,12px)}.group{min-height:0}.explanation{padding:clamp(9px,1.6vh,14px)}}

/* Named axes replace the explanatory note and corner abbreviation. */
.outcome-axes{display:grid;grid-template-columns:31px minmax(0,1fr);grid-template-rows:25px auto;column-gap:4px;row-gap:4px;max-width:640px;width:100%;margin:0 auto;align-items:stretch}
.axis-column-title{grid-column:2;grid-row:1;margin-left:52px;text-align:center;align-self:end;font-weight:800;font-size:clamp(13px,1.5vw,17px);color:var(--navy);line-height:1.2}
.axis-row-title{grid-column:1;grid-row:2;writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:clamp(13px,1.5vw,17px);color:var(--navy);line-height:1.2}
.outcome-axes .outcomes{grid-column:2;grid-row:2;max-width:none;margin:0}
@media(max-width:520px){.outcome-axes{grid-template-columns:23px minmax(0,1fr);grid-template-rows:23px auto;gap:3px}.axis-column-title{margin-left:38px;font-size:13px}.axis-row-title{font-size:13px}}

<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const configs={
 different:{question:'A student can choose one of 3 shirts and one of 4 pairs of trousers. How many different outfits are possible?',a:['S1','S2','S3'],b:['T1','T2','T3','T4'],aLabel:'Shirts (3 choices)',bLabel:'Trousers (4 choices)',calc:'3 × 4 = 12',why:'3 shirts × 4 trousers = 12 different outfits'},
 ordered:{question:'Four students (A, B, C and D) are available. Choose a captain and a vice-captain. How many different outcomes are possible?',a:['A','B','C','D'],b:['A','B','C','D'],aLabel:'Captain (4 choices)',bLabel:'Vice-captain (3 left)',calc:'4 × 3 = 12',why:'Different roles: A then B is different from B then A'},
 unordered:{question:'Four students (A, B, C and D) are available. Choose 2 students to represent the class. How many different pairs are possible?',a:['A','B','C','D'],b:['A','B','C','D'],aLabel:'First student (4 choices)',bLabel:'Second student (3 left)',calc:'(4 × 3) ÷ 2 = 6',why:'Each pair is counted twice, so halve the arrangements'}
};
let type='different',completed=0,activeRow=-1,activeCol=-1,playing=false,auto=false,calculationShown=false,timer=null;
const conf=()=>configs[type];
const rowCount=()=>conf().a.length;
const duration=500;
function stopAnimation(){if(timer!==null)clearTimeout(timer);timer=null;playing=false;auto=false;activeRow=-1;activeCol=-1;$('play').textContent='▶ Play all rows';}
function makeTokens(id,items,selected,seen,blocked,pink){
 const parent=$(id);parent.replaceChildren();
 items.forEach((name,i)=>{
  const el=document.createElement('span');
  el.className='token'+(pink?' pink':'')+(selected===i?' active':'')+(blocked===i?' taken':'')+(seen.includes(i)&&selected!==i?' visited':'');
  el.textContent=name;
  parent.appendChild(el);
 });
}
function cellText(c,i,j){return `${c.a[i]}, ${c.b[j]}`;}
function cellState(i,j){const diag=type!=='different'&&i===j,dup=type==='unordered'&&j<i;return diag?'invalid':dup?'duplicate':(type==='unordered'?'keep':'valid');}
function renderGrid(){
 const c=conf(),grid=$('outcomes');grid.replaceChildren();
 $('rowTitle').textContent=type==='different'?'Shirts':type==='ordered'?'Captain':'First student';
 $('columnTitle').textContent=type==='different'?'Trousers':type==='ordered'?'Vice-captain':'Second student';
 const corner=document.createElement('div');corner.className='axis corner';corner.textContent='';grid.appendChild(corner);
 c.b.forEach(name=>{const el=document.createElement('div');el.className='axis';el.textContent=name;grid.appendChild(el);});
 for(let i=0;i<c.a.length;i++){
  const ax=document.createElement('div');ax.className='axis';ax.textContent=c.a[i];grid.appendChild(ax);
  for(let j=0;j<c.b.length;j++){
   const cell=document.createElement('div');
   const visible=i<completed||(i===activeRow&&j<=activeCol);
   const current=i===activeRow&&j===activeCol;
   cell.className='cell '+(visible?cellState(i,j):'hidden-cell')+(current?' current-pair':'');
   cell.textContent=visible&&cellState(i,j)==='invalid'?'':cellText(c,i,j);
   cell.title=type!=='different'&&i===j?'The same student cannot be chosen twice':type==='unordered'&&j<i?'A duplicate of '+cellText(c,j,i):cellText(c,i,j);
   grid.appendChild(cell);
  }
 }
 $('legend').innerHTML=completed===0&&activeRow<0?'':type==='different'?'<span><i class="swatch"></i> Valid combination</span>':type==='ordered'?'<span><i class="swatch"></i> Valid arrangement</span><span><i class="swatch invalid"></i> Cannot select the same student twice</span>':'<span><i class="swatch keep"></i> Unique pairs</span><span><i class="swatch duplicate"></i> Same pair already counted</span><span><i class="swatch invalid"></i> Same student twice</span>';
}
function render(){
 const c=conf(),count=rowCount();
 $('questionText').textContent=c.question;$('group1Label').textContent=c.aLabel;$('group2Label').textContent=c.bLabel;
 const first=activeRow>=0?activeRow:completed>0?completed-1:-1;
 const seen=activeRow>=0?Array.from({length:activeCol+1},(_,i)=>i):(first>=0?Array.from({length:c.b.length},(_,i)=>i).filter(i=>type==='different'||i!==first):[]);
 const chosen=activeRow>=0?activeCol:-1;
 makeTokens('tokensA',c.a,first,[],-1,false);
 makeTokens('tokensB',c.b,chosen,seen,type==='different'?-1:first,true);
 if(activeRow>=0){
  $('selectHint').textContent='Watch each possible second choice light up as its outcome appears in the grid.';
  if(type==='different')$('explanation').innerHTML=`With <strong>${c.a[first]}</strong> chosen, each pair of trousers is considered in turn. <strong>${Math.max(0,activeCol+1)} of ${c.b.length}</strong> outcomes shown in this row.`;
  else if(type==='ordered')$('explanation').innerHTML=`Choose <strong>${c.a[first]}</strong> as captain, then try each vice-captain in turn. Choosing the same student twice is not allowed.`;
  else $('explanation').innerHTML=`Choose <strong>${c.a[first]}</strong> first, then consider each second student. Reversed pairs are duplicates, so only one will count.`;
 }else if(completed===0){
  $('selectHint').textContent='Reveal a row to see each second choice highlighted one at a time.';
  $('explanation').innerHTML=type==='different'?'Choose one item from <strong>each of two different groups</strong>. Choosing a shirt does not remove any trousers.':type==='ordered'?'The two roles come from <strong>the same group</strong>. A student cannot hold both roles, and swapping roles changes the outcome.':'Choose <strong>two different students</strong>. There are no distinct roles, so reversing their order gives the same pair.';
 }else{
  $('selectHint').textContent='One completed row represents every possible second choice for one first choice.';
  $('explanation').innerHTML=completed===count?'Every row is complete. Use <strong>Reveal final calculation</strong> to connect the grid to the counting method.':`The row beginning with <strong>${c.a[completed-1]}</strong> is complete. Reveal the next row to continue.`;
 }
 renderGrid();
 $('equation').hidden=!calculationShown;$('why').hidden=!calculationShown;$('equation').textContent=c.calc;$('why').textContent=c.why;
 $('revealCalc').textContent=calculationShown?'Hide final calculation':'Reveal final calculation';$('revealCalc').setAttribute('aria-expanded',String(calculationShown));
 $('next').disabled=playing||completed>=count;$('next').textContent=completed>=count?'All rows revealed':(completed===0&&activeRow<0?'Reveal first row →':'Reveal next row →');
 $('progress').textContent=activeRow>=0?`Row ${activeRow+1}: choice ${activeCol+1<0?0:activeCol+1} of ${c.b.length}`:`${completed} of ${count} rows revealed`;
}
function stepTick(){
 if(!playing)return;
 activeCol++;
 render();
 if(activeCol<conf().b.length-1){timer=setTimeout(stepTick,duration);return;}
 // Keep the last pairing highlighted briefly, then complete the row.
 timer=setTimeout(()=>{
  if(!playing)return;
  completed=activeRow+1;activeRow=-1;activeCol=-1;render();
  if(auto&&completed<rowCount()){timer=setTimeout(beginRow,350);}
  else {playing=false;auto=false;$('play').textContent='▶ Play all rows';render();}
 },duration);
}
function beginRow(){
 if(completed>=rowCount()){playing=false;auto=false;render();return;}
 playing=true;activeRow=completed;activeCol=-1;
 $('play').textContent=auto?'Ⅱ Pause animation':'Ⅱ Pause row';
 render();
 timer=setTimeout(stepTick,200);
}
function reset(){stopAnimation();completed=0;calculationShown=false;render();}
$('type').addEventListener('change',e=>{stopAnimation();type=e.target.value;completed=0;calculationShown=false;render();});
$('next').addEventListener('click',()=>{if(playing||completed>=rowCount())return;auto=false;beginRow();});
$('reset').addEventListener('click',reset);
$('revealCalc').addEventListener('click',()=>{calculationShown=!calculationShown;render();});
$('play').addEventListener('click',()=>{
 if(playing){stopAnimation();render();return;}
 if(completed>=rowCount())completed=0;
 auto=true;beginRow();
});
render();
})();
</script></body></html>
